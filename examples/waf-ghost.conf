# Ghost admin uses PUT, PATCH, and DELETE. CRS default is GET HEAD POST OPTIONS.
SecAction \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Editor saves contain HTML and code samples. Skip XSS/SQLi/RCE only on those
# body fields. URI and header checks on the same request still run.
SecRule REQUEST_URI "@rx ^/ghost/api/admin/(posts|pages)(/|$)" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS_NAMES"
