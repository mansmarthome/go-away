# Fragment for a TLS-terminating frontend in front of go-away.
# Not a complete configuration. Certificates, timeouts, ACLs, and backends stay local.
#
# JA4 is computed by https://github.com/FriendlyCaptcha/ja4-haproxy (HAProxy 3.2+, Lua 5.4+).
# Install ja4.lua, then match these header names in the policy (examples/generic.yml):
#   X-Forwarded-JA4
#   X-Forwarded-HTTP-Version
#
# go-away does not see the client ClientHello here, so fp.ja4 is empty.
# The HTTP version on the backend connection is the proxy hop, not the client's.
#
# defaults needs `mode http` and `log global` for the JSON log-format below.

global
    log /dev/log daemon info

    # Capture indexes must stay aligned with capture.req.hdr(N) in the frontend.
    setenv HTTPLOG_JSON_BASE    "%{+json}o %(remote_address)ci %(remote_port)cp %(fe_name_transport)ft %(be_name)b %(server_name)s %(time_request)TR %(time_wait)Tw %(time_connect)Tc %(time_response)Tr/%(time_active)Ta %(status_code)ST %(bytes_read)B"
    setenv HTTPLOG_JSON_HEADERS "%(http_request){+Q}r %(host)[capture.req.hdr(0)] %(user_agent)[capture.req.hdr(1)] %(sec_ch_ua)[capture.req.hdr(2)] %(referer)[capture.req.hdr(3)] %(ja4)[capture.req.hdr(4)]"
    setenv HTTPLOG_JSON         "${HTTPLOG_JSON_BASE} ${HTTPLOG_JSON_HEADERS}"

    # Required for JA4. A short buffer drops extensions and the hash is wrong.
    # https://github.com/FriendlyCaptcha/ja4-haproxy#haproxy-capture-buffer-size
    tune.ssl.capture-buffer-size 336

    # Recommended by ja4.lua. The script also tolerates the old default.
    tune.lua.bool-sample-conversion normal

    lua-load-per-thread /etc/haproxy/lua/ja4.lua

frontend https
    bind *:443 ssl crt /etc/haproxy/certs/example.pem

    http-request lua.ja4 if { ssl_fc }

    http-request capture req.fhdr(Host) len 64
    http-request capture req.fhdr(User-Agent) len 128
    http-request capture req.fhdr(Sec-CH-UA) len 128
    http-request capture req.fhdr(Referer) len 256
    http-request capture var(txn.ja4) len 36 if { ssl_fc }

    log-format "${HTTPLOG_JSON}"

    http-request set-header X-Forwarded-JA4 %[var(txn.ja4)] if { ssl_fc }
    http-request set-header X-Forwarded-HTTP-Version %[req.ver]
